[project]
name = "mamagift-foundation"
version = "0.1.0"
description = "MamaGift Phase 0 deterministic application foundation"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = [
    "services/api",
    "services/ai-worker",
    "packages/contracts/python",
]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = [
    "services/api",
    "services/ai-worker",
    "packages/contracts/python",
    "tools",
]
exclude = ["services/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = [
    "services/api/app",
    "packages/contracts/python/mamagift_contracts",
    "tools/ci/check_docs.py",
]
mypy_path = "services/api:services/ai-worker:packages/contracts/python"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
