name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate planning files
        run: python tools/ci/check_docs.py

  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tracked repository contents
        run: python tools/ci/check_repo_hygiene.py

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan tracked text files
        run: python tools/ci/check_secrets.py

  backend-lint:
    name: backend-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Python format check
        run: uv run ruff format --check services/api services/ai-worker packages/contracts tools

      - name: Python lint
        run: uv run ruff check services/api services/ai-worker packages/contracts tools

      - name: Python typecheck
        run: uv run mypy

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mamagift
          POSTGRES_USER: mamagift
          POSTGRES_PASSWORD: mamagift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mamagift -d mamagift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run backend tests with PostgreSQL migration smoke
        env:
          MAMAGIFT_TEST_DATABASE_URL: postgresql+psycopg://mamagift:mamagift@localhost:5432/mamagift
        run: uv run pytest -q

  frontend-lint-typecheck-test:
    name: frontend-lint-typecheck-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefix apps/web

      - name: Frontend format check
        run: npm run format:check --prefix apps/web

      - name: Frontend lint
        run: npm run lint --prefix apps/web

      - name: Frontend typecheck
        run: npm run typecheck --prefix apps/web

      - name: Frontend unit test
        run: npm run test:run --prefix apps/web

      - name: Frontend build
        run: npm run build --prefix apps/web

  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f infra/compose/docker-compose.yml config --quiet
