name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate planning baseline
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            docs/00_PROJECT_CHARTER.md
            docs/01_ARCHITECTURE.md
            docs/02_INFRASTRUCTURE.md
            docs/03_DOCUMENT_PIPELINE.md
            docs/04_PHASE_PLAN.md
            docs/05_TEST_STRATEGY.md
            docs/06_CICD.md
            docs/07_DATA_AND_CONTINUAL_LEARNING.md
            docs/08_API_AND_DATA_CONTRACTS.md
            docs/09_CODEX_EXECUTION.md
            docs/PHASE_STATUS.md
          )

          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required planning file: $file"; exit 1; }
          done

      - name: Repository safety guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess
          import sys

          tracked = [
              p for p in subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
              if p
          ]

          errors = []
          allowed_env_names = {".env.example"}
          private_parts = {"private", "private_data", "real_school_docs"}
          size_limit = 20 * 1024 * 1024

          for path in tracked:
              parts = set(path.split("/"))
              basename = os.path.basename(path)

              if basename.startswith(".env") and basename not in allowed_env_names:
                  errors.append(f"real .env-like file committed: {path}")

              if parts & private_parts:
                  errors.append(f"private-data path committed: {path}")

              if os.path.isfile(path):
                  size = os.path.getsize(path)
                  if size > size_limit:
                      errors.append(f"tracked file exceeds 20 MiB guard: {path} ({size} bytes)")

          if errors:
              print("Repository safety guard failed:")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)
          PY

      - name: Reject merge-conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.lock'; then
            echo "Merge conflict marker detected."
            exit 1
          fi

  phase-zero-placeholder:
    name: phase-zero-placeholder
    runs-on: ubuntu-latest
    steps:
      - name: Explain bootstrap state
        run: |
          echo "Application-specific backend/frontend/parser jobs are intentionally added during Phase 0 and later phases."
          echo "See docs/06_CICD.md and docs/04_PHASE_PLAN.md."
