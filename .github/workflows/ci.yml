name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate planning files
        run: python tools/ci/check_docs.py

  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tracked repository contents
        run: python tools/ci/check_repo_hygiene.py

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan tracked text files
        run: python tools/ci/check_secrets.py

  backend-lint:
    name: backend-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Python format check
        run: uv run ruff format --check services/api services/ai-worker packages tools tests benchmarks

      - name: Python lint
        run: uv run ruff check services/api services/ai-worker packages tools tests benchmarks

      - name: Python typecheck
        run: uv run mypy

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mamagift
          POSTGRES_USER: mamagift
          POSTGRES_PASSWORD: mamagift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mamagift -d mamagift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run backend tests with PostgreSQL migration smoke
        env:
          MAMAGIFT_TEST_DATABASE_URL: postgresql+psycopg://mamagift:mamagift@localhost:5432/mamagift
        run: uv run pytest -q

  frontend-lint-typecheck-test:
    name: frontend-lint-typecheck-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefix apps/web

      - name: Frontend format check
        run: npm run format:check --prefix apps/web

      - name: Frontend lint
        run: npm run lint --prefix apps/web

      - name: Frontend typecheck
        run: npm run typecheck --prefix apps/web

      - name: Frontend unit test
        run: npm run test:run --prefix apps/web

      - name: Frontend build
        run: npm run build --prefix apps/web

  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f infra/compose/docker-compose.yml config --quiet

  parser-contract-tests:
    name: parser-contract-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      # No GPU, no model weights, no private documents: heavy parsers take part
      # through recorded provider output.
      - name: Router, canonical schema and adapter contract tests
        run: uv run pytest tests/unit tests/contract -q

  ingestion-integration:
    name: ingestion-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      # Upload, storage, state machine, jobs and the full upload -> canonical path.
      # No GPU, no private documents: the CI-safe baseline parser is the only one run.
      - name: Ingestion integration tests
        run: |
          uv run pytest \
            services/api/tests/test_upload_api.py \
            services/api/tests/test_jobs.py \
            services/api/tests/test_storage.py \
            services/api/tests/test_state_machine.py \
            services/api/tests/test_ingestion_integration.py \
            tests/unit/test_ingestion_pipeline.py \
            tests/unit/test_parser_strategy.py -q

  admin-parser-golden-tests:
    name: admin-parser-golden-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Vietnamese administrative parser golden tests
        run: uv run pytest tests/golden -q

  db-migration-test:
    name: db-migration-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mamagift
          POSTGRES_USER: mamagift
          POSTGRES_PASSWORD: mamagift
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mamagift -d mamagift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Apply migrations from an empty PostgreSQL database
        env:
          MAMAGIFT_TEST_DATABASE_URL: postgresql+psycopg://mamagift:mamagift@localhost:5432/mamagift
        run: uv run pytest services/api/tests/test_migrations.py -q

  feedback-tests:
    name: feedback-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      # Correction feedback: submit -> overlay on canonical, raw prediction preserved.
      - name: Correction feedback tests
        run: uv run pytest services/api/tests/test_feedback_api.py -q

  web-e2e-smoke:
    name: web-e2e-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --prefix apps/web

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # Real API + worker + SQLite, not mocks: upload -> processing -> open document
      # -> verify metadata -> jump to cited page -> correct field -> reload -> the
      # correction persists (docs/04_PHASE_PLAN.md Phase 3).
      - name: Browser E2E flow
        run: npm run test:e2e --prefix apps/web

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  parser-benchmark-smoke:
    name: parser-benchmark-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Validate the benchmark manifest
        env:
          PYTHONPATH: packages/contracts/python:packages/docpipe/python
        run: uv run python -m tools.parser_bench validate --manifest benchmarks/parser/manifest.jsonl

      - name: Benchmark harness smoke run on synthetic fixtures
        run: uv run pytest tests/benchmark -q

      - name: Lightweight benchmark run
        env:
          PYTHONPATH: packages/contracts/python:packages/docpipe/python
        run: |
          uv run python -m tools.parser_bench run \
            --manifest benchmarks/parser/manifest.jsonl \
            --parsers pymupdf \
            --output artifacts/parser-bench/ci-${{ github.run_id }}

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-bench-smoke
          path: artifacts/parser-bench/
          retention-days: 7
